<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queen Ad · Diamond Set 2K26</title>
    <!-- Google Fonts: Extreme precision -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <!-- html2canvas for professional PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b10;
            background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0b0b10 80%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 2.5rem 2.5rem 4rem;
            color: #f0f0f5;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Grain Texture (Corel can't touch this) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            opacity: 0.6;
            mix-blend-mode: overlay;
        }

        /* ---------- DOWNLOAD BUTTON (Fixed Top-Right) ---------- */
        #downloadBtn {
            position: fixed;
            top: 28px;
            right: 28px;
            z-index: 1000;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 12px 28px;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.15);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #downloadBtn:hover {
            background: #d4af37;
            color: #0b0b10;
            box-shadow: 0 8px 40px rgba(212, 175, 55, 0.4);
            transform: scale(1.02);
        }
        #downloadBtn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ---------- CAPTURE AREA (Everything below) ---------- */
        #capture-area {
            position: relative;
            z-index: 10;
        }

        /* ---------- HEADER (Top Left) ---------- */
        .school-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            position: relative;
            z-index: 10;
        }

        /* Editable Crest */
        .school-crest {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: linear-gradient(145deg, #d4af37, #b8962e);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.25);
            flex-shrink: 0;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }
        .school-crest:hover {
            transform: scale(1.05);
            border-color: #d4af37;
        }
        .school-crest svg {
            width: 44px;
            height: 44px;
            fill: #0b0b10;
        }
        .school-crest img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .school-crest .upload-hint {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            font-size: 0.45rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #d4af37;
            text-align: center;
            padding: 2px 0;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .school-crest:hover .upload-hint {
            opacity: 1;
        }
        .school-crest input[type="file"] {
            display: none;
        }

        /* School Name & Diamond Set */
        .school-name-group {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .school-name {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            line-height: 1;
            background: linear-gradient(to right, #ffffff, #c0c0d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }
        .diamond-set {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.4em;
            color: #d4af37;
            text-transform: uppercase;
            border-left: 3px solid #d4af37;
            padding-left: 1rem;
            -webkit-text-fill-color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        /* ---------- HERO TITLE ---------- */
        .hero-title {
            font-size: clamp(4.5rem, 15vw, 10rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.95;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #d4af37 40%, #f6e27a 70%, #d4af37 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: metallicShift 6s ease-in-out infinite alternate;
            position: relative;
            z-index: 5;
        }

        @keyframes metallicShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .hero-sub {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .upload-counter {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 0.4rem 1.6rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #d4af37;
        }
        .upload-counter span {
            color: #ffffff;
            font-weight: 800;
        }

        /* ---------- THE 67 CIRCLE GRID ---------- */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 1rem;
            position: relative;
            z-index: 5;
        }

        /* Circular Slot */
        .slot {
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .slot:hover {
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-4px) scale(1.04);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.2);
        }

        /* Empty state icon */
        .slot .empty-icon {
            font-size: 2.6rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.08);
            transition: all 0.3s;
            user-select: none;
            line-height: 1;
        }
        .slot:hover .empty-icon {
            color: rgba(212, 175, 55, 0.3);
            transform: scale(1.1);
        }

        /* Uploaded Image state (Circle) */
        .slot img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            transition: opacity 0.4s ease;
            opacity: 0;
        }
        .slot.filled img {
            opacity: 1;
        }
        .slot.filled {
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.15);
            background: #111;
        }
        .slot.filled .empty-icon {
            opacity: 0;
        }

        /* Remove button (appears on hover of filled circle) */
        .slot .remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 70, 70, 0.5);
            border-radius: 50%;
            color: #ff4d4d;
            font-size: 14px;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
            z-index: 20;
            font-weight: 300;
            pointer-events: none;
        }
        .slot.filled:hover .remove-btn {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .slot .remove-btn:hover {
            background: #ff4d4d;
            color: #0b0b10;
            border-color: #ff4d4d;
            transform: scale(1.15);
        }

        .slot input[type="file"] {
            display: none;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            body { padding: 1.5rem 1.5rem 3rem; }
            #downloadBtn { top: 16px; right: 16px; padding: 8px 18px; font-size: 0.7rem; }
            .school-header { gap: 1rem; margin-bottom: 2rem; }
            .school-crest { width: 56px; height: 56px; }
            .school-crest svg { width: 30px; height: 30px; }
            .school-name { font-size: 1.4rem; letter-spacing: 0.1em; }
            .diamond-set { font-size: 0.75rem; padding-left: 0.6rem; letter-spacing: 0.2em; }
            .hero-title { font-size: clamp(3rem, 20vw, 5rem); }
            .hero-sub { font-size: 0.7rem; letter-spacing: 0.3em; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 14px; }
        }

        @media (max-width: 480px) {
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
            .slot .empty-icon { font-size: 1.6rem; }
            .slot .remove-btn { width: 20px; height: 20px; font-size: 10px; line-height: 20px; top: 4px; right: 4px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #14141c; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 12px; }
    </style>
</head>
<body>

    <!-- ========== DOWNLOAD BUTTON (Fixed) ========== -->
    <button id="downloadBtn">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Export PNG
    </button>

    <!-- ========== CAPTURE AREA ========== -->
    <div id="capture-area">

        <!-- ===== HEADER: Editable Crest + Queen Ad + Diamond Set ===== -->
        <header class="school-header">
            <div class="school-crest" id="crestContainer">
                <!-- Default SVG Shield -->
                <svg id="crestSvg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm0 2.2l6.6 2.9V11c0 4.1-2.9 8.1-6.6 9.3V3.2z"/>
                    <rect x="10" y="8" width="4" height="8" rx="1" />
                    <rect x="8" y="11" width="8" height="2" rx="1" />
                </svg>
                <!-- Uploaded Image Preview -->
                <img id="crestImg" alt="School Crest" />
                <span class="upload-hint">Upload Logo</span>
                <input type="file" id="crestInput" accept="image/*" />
            </div>
            <div class="school-name-group">
                <div class="school-name">QUEEN AD SCHOOLS</div>
                <div class="diamond-set">◆ DIAMOND SET ◆</div>
            </div>
        </header>

        <!-- ===== HERO ===== -->
        <h1 class="hero-title">Set of 2K26</h1>
        <div class="hero-sub">
            <span>67 MEMORIES · ONE FRAME</span>
            <span class="upload-counter"><span id="countDisplay">0</span> / 67 uploaded</span>
        </div>

        <!-- ===== THE 67 CIRCULAR SLOTS ===== -->
        <div class="photo-grid" id="photoGrid"></div>

    </div>

    <script>
        (function() {
            const TOTAL_SLOTS = 67;
            const grid = document.getElementById('photoGrid');
            const countDisplay = document.getElementById('countDisplay');

            // --- Crest Logic ---
            const crestContainer = document.getElementById('crestContainer');
            const crestInput = document.getElementById('crestInput');
            const crestSvg = document.getElementById('crestSvg');
            const crestImg = document.getElementById('crestImg');

            crestContainer.addEventListener('click', function(e) {
                // Prevent triggering if clicking the hint text, but it's fine.
                crestInput.click();
            });

            crestInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const url = URL.createObjectURL(file);
                    crestImg.src = url;
                    crestImg.style.display = 'block';
                    crestSvg.style.display = 'none';
                }
            });

            // --- Grid Logic ---
            const slotStates = new Array(TOTAL_SLOTS).fill(null);

            function updateCounter() {
                const filled = slotStates.filter(s => s !== null).length;
                countDisplay.textContent = filled;
            }

            function handleFileSelect(index, inputElement) {
                return function(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    if (slotStates[index]) {
                        URL.revokeObjectURL(slotStates[index]);
                    }

                    const objectURL = URL.createObjectURL(file);
                    slotStates[index] = objectURL;

                    const slotDiv = inputElement.closest('.slot');
                    const img = slotDiv.querySelector('img');
                    img.src = objectURL;
                    slotDiv.classList.add('filled');

                    updateCounter();
                };
            }

            function handleRemove(index, slotDiv) {
                return function(e) {
                    e.stopPropagation();

                    if (slotStates[index]) {
                        URL.revokeObjectURL(slotStates[index]);
                        slotStates[index] = null;
                    }

                    const img = slotDiv.querySelector('img');
                    img.src = '';
                    slotDiv.classList.remove('filled');

                    const input = slotDiv.querySelector('input[type="file"]');
                    input.value = '';

                    updateCounter();
                };
            }

            function createSlot(index) {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'slot';
                slotDiv.setAttribute('data-index', index);

                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                slotDiv.appendChild(input);

                const img = document.createElement('img');
                img.alt = `Photo ${index + 1}`;
                slotDiv.appendChild(img);

                const icon = document.createElement('span');
                icon.className = 'empty-icon';
                icon.textContent = '＋';
                slotDiv.appendChild(icon);

                const removeBtn = document.createElement('div');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '✕';
                slotDiv.appendChild(removeBtn);

                slotDiv.addEventListener('click', function(e) {
                    if (e.target.classList.contains('remove-btn')) return;
                    const fileInput = this.querySelector('input[type="file"]');
                    fileInput.click();
                });

                input.addEventListener('change', handleFileSelect(index, input));
                removeBtn.addEventListener('click', handleRemove(index, slotDiv));

                return slotDiv;
            }

            for (let i = 0; i < TOTAL_SLOTS; i++) {
                grid.appendChild(createSlot(i));
            }
            updateCounter();

            // --- Download Logic (html2canvas) ---
            document.getElementById('downloadBtn').addEventListener('click', function() {
                const area = document.getElementById('capture-area');
                html2canvas(area, {
                    scale: 2.5,
                    useCORS: true,
                    allowTaint: false,
                    backgroundColor: '#0b0b10',
                    logging: false,
                    width: area.scrollWidth,
                    height: area.scrollHeight,
                    windowWidth: area.scrollWidth,
                    windowHeight: area.scrollHeight
                }).then(function(canvas) {
                    const link = document.createElement('a');
                    link.download = 'QueenAd_DiamondSet_2K26.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(function(err) {
                    alert('Unable to capture. Please ensure images are loaded and try again.');
                    console.error(err);
                });
            });

        })();
    </script>

</body>
</html>
